[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,LICENSE.txt,docs/CREDITS.md,assets/fonts/*-OFL.txt"
exclude_filter="tests/*,tools/*,screenshots/*,build/*,review/*,AGENTS.md,CLAUDE.md,apple-identity.json,docs/FUNTEST.md,docs/SPEC.md,docs/STYLE.md,docs/DECISIONS.md"
export_path="build/itch/web/index.html"
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include="<meta name=\"theme-color\" content=\"#3B2A22\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]
name="macOS Unsigned Test"
platform="macOS"
runnable=false
export_filter="all_resources"
include_filter="data/*.json,LICENSE.txt,docs/CREDITS.md,assets/fonts/*-OFL.txt"
exclude_filter="tests/*,tools/*,screenshots/*,build/*,review/*,AGENTS.md,CLAUDE.md,apple-identity.json,docs/SPEC.md,docs/STYLE.md,docs/DECISIONS.md,docs/FUNTEST.md"
export_path="build/macos/Belvedere-test.zip"
encrypt_pck=false
encrypt_directory=false

[preset.1.options]
application/bundle_identifier="com.puzzaholics.shiftingmanor"
application/short_version="0.1"
application/version="1"
application/export_angle=0
binary_format/architecture="universal"
codesign/codesign=0
notarization/notarization=0
